<title>Perihan Moda</title>

<meta name="apple-mobile-web-app-title" content="Perihan Moda">
<script>
(function(){
  var EXEC = "https://script.google.com/macros/s/AKfycbxFFVR6hKyB6DppPa8uZyakLw4tNOMP4ah_cH6XnBS74iswTKoQjBA6OqI6Kab5l-_Jzg/exec";
  function kos(basari, hata){
    return new Proxy({}, { get: function(_, ad){
      if (ad === 'withSuccessHandler') return function(f){ return kos(f, hata); };
      if (ad === 'withFailureHandler') return function(f){ return kos(basari, f); };
      return function(){
        var args = Array.prototype.slice.call(arguments);
        fetch(EXEC, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: ad, args: args }), redirect: 'follow' })
          .then(function(r){ return r.json(); })
          .then(function(j){ if (j.ok) { basari && basari(j.veri); } else { hata && hata(new Error(j.hata)); } })
          .catch(function(){ hata && hata(new Error('İnternet bağlantısı yok ya da zayıf. Tekrar dene.')); });
      };
    }});
  }
  window.google = { script: { run: kos(null, null) } };
})();
</script>
<meta charset="utf-8">
<base target="_blank">
<meta name="theme-color" content="#FAF6F1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&display=swap">
<style>
/* Yön: "Dükkan defteri, ama Instagram gibi". Sıcak fildişi zemin, koyu mürdüm yazı, tek vurgu rengi koyu gül.
   Kullanıcılar ileri yaşta: yazı en az 18 px, dokunma alanı en az 56 px, her butonda yazı var.
   Bildikleri kalıplar: hikâye halkaları, WhatsApp sohbet listesi, profil başlığı, mesaj balonları. */
:root{
  --bg:#FAF6F1; --surface:#FFFDF9; --surface-2:#F5EDE8; --sunk:#EFE5DF;
  --ink:#2B1A22; --ink-2:#4A3440; --muted:#6F5C64; --line:#EADDD6; --line-2:#DCC9C0;
  --accent:#A3405F; --accent-hi:#B4506F; --accent-ink:#FFFFFF; --accent-soft:#F6E4E8; --accent-2:#7E3352;
  --altin:#B08D57; --altin-soft:#F3E9D9;
  --gradyan:linear-gradient(135deg,#B4506F 0%,#8C3A5A 100%);
  --gradyan-yumusak:linear-gradient(135deg,#F8E6EA 0%,#F3E9D9 100%);
  --gradyan-zemin:linear-gradient(180deg,#F7EAE8 0%,#FAF6F1 260px);
  --ok:#1E7A50; --ok-soft:#DDF1E6; --warn:#A8560C; --warn-soft:#FBEBD9; --bad:#B42828; --bad-soft:#FBE3E1;
  --wa:#1F8F4E; --ring-a:#D9BB8A; --ring-b:#A3405F;
  --bubble-me:#F6E4E8; --bubble-ai:#FFFDF9;
  --scrim:rgba(42,22,33,.5);
  --sh-1:0 1px 2px rgba(42,22,33,.06);
  --sh-2:0 1px 2px rgba(42,22,33,.05),0 14px 30px -18px rgba(42,22,33,.35);
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r-s:12px; --r-m:16px; --r-l:22px;
  --tab-h:76px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root[data-theme="oto"]{
  --bg:#17111A; --surface:#211922; --surface-2:#2A2029; --sunk:#120D14;
  --ink:#F6EEF2; --ink-2:#E2D5DC; --muted:#B5A3AE; --line:#352A33; --line-2:#463844;
  --accent:#E0638A; --accent-hi:#F07A9D; --accent-ink:#1B0E14; --accent-soft:#3D1D2A;
  --ok:#5BD196; --ok-soft:#163327; --warn:#F2A65A; --warn-soft:#3A2714; --bad:#FF8577; --bad-soft:#3E1B19;
  --wa:#4CD486; --bubble-me:#3D1D2A; --bubble-ai:#2A2029;
  --scrim:rgba(0,0,0,.65); --sh-1:none; --sh-2:none;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --accent-2:#F07A9D; --altin:#D9BB8A; --altin-soft:#3A2E1E;
  --gradyan:linear-gradient(135deg,#E0638A 0%,#C4507A 100%); --gradyan-yumusak:linear-gradient(135deg,#3D1D2A 0%,#3A2E1E 100%); --gradyan-zemin:none;
  --bg:#17111A; --surface:#211922; --surface-2:#2A2029; --sunk:#120D14;
  --ink:#F6EEF2; --ink-2:#E2D5DC; --muted:#B5A3AE; --line:#352A33; --line-2:#463844;
  --accent:#E0638A; --accent-hi:#F07A9D; --accent-ink:#1B0E14; --accent-soft:#3D1D2A;
  --ok:#5BD196; --ok-soft:#163327; --warn:#F2A65A; --warn-soft:#3A2714; --bad:#FF8577; --bad-soft:#3E1B19;
  --wa:#4CD486; --bubble-me:#3D1D2A; --bubble-ai:#2A2029;
  --scrim:rgba(0,0,0,.65); --sh-1:none; --sh-2:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.45;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:18px}
button{-webkit-tap-highlight-color:transparent;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.ico{width:24px;height:24px;flex:none;display:inline-block;vertical-align:middle}
.ico svg{width:100%;height:100%;display:block}

/* ---------- butonlar ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:12px 20px;border-radius:var(--r-m);
  border:2px solid var(--line-2);background:var(--surface);font-weight:650;font-size:18px;text-align:center;line-height:1.2}
.btn:active{transform:scale(.98)}
.btn.ana{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ana:active{background:var(--accent-hi)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.yumusak{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.tehlike{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn.tam{width:100%}
.btn.kucuk{min-height:48px;padding:8px 14px;font-size:16px}
.btn[disabled]{opacity:.55}
.btn-sira{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-sira.uc{grid-template-columns:1fr 1fr 1fr}
.btn-sira .btn{padding-left:8px;padding-right:8px}

/* ---------- üst çubuk ve alt menü ---------- */
.ust{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.ust .wrap{display:flex;align-items:center;gap:10px;min-height:64px;padding-top:env(safe-area-inset-top,0px)}
.ust h1{font-family:var(--f-display);font-size:26px;font-weight:600;margin:0;flex:1;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ust-btn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:60px;min-height:56px;border:0;background:transparent;font-size:13px;font-weight:650;color:var(--ink-2);border-radius:var(--r-s)}
.ust-btn .ico{width:26px;height:26px}
.ust-btn.sor{color:var(--accent)}
.alt{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.alt .wrap{display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab-h)}
.sekme{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:16px;font-weight:650;color:var(--muted)}
.sekme .ico{width:30px;height:30px}
.sekme[aria-current="page"]{color:var(--accent)}
.sekme[aria-current="page"] .ico{background:var(--accent-soft);border-radius:999px;width:64px;padding:2px 17px;box-sizing:border-box;height:32px}
main{padding-bottom:calc(var(--tab-h) + 32px + env(safe-area-inset-bottom,0px))}

/* ---------- hikâyeler ---------- */
.hikayeler{display:flex;gap:14px;overflow-x:auto;padding:14px 2px 6px;scrollbar-width:none}
.hikayeler::-webkit-scrollbar{display:none}
.hikaye{flex:none;width:84px;border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.halka{width:80px;height:80px;border-radius:50%;padding:3px;background:conic-gradient(from 210deg,var(--ring-a),var(--ring-b),var(--ring-a))}
.halka.soluk{background:var(--line-2)}
.halka>*{width:100%;height:100%;border-radius:50%;border:3px solid var(--bg)}
.hikaye b{font-size:15px;line-height:1.15;font-weight:650;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hikaye small{font-size:14px;color:var(--accent);font-weight:700;margin-top:-4px}

/* ---------- avatar ---------- */
.av{width:56px;height:56px;border-radius:50%;flex:none;object-fit:cover;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-display);font-size:24px;font-weight:600;color:#fff;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.b{width:104px;height:104px;font-size:44px}
.halka>.av{width:100%;height:100%}

/* ---------- bölüm ve kartlar ---------- */
.bolum{margin-top:22px}
.bolum-bas{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.bolum-bas h2{font-size:21px;margin:0;flex:1;font-weight:750;letter-spacing:-.01em}
.bolum-bas .sayi{background:var(--accent-soft);color:var(--accent);font-weight:750;border-radius:999px;padding:2px 12px;font-size:16px}
.kart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-1)}
.kart.ic{padding:16px}
.selam{padding-top:16px}
.selam h2{font-family:var(--f-display);font-size:30px;font-weight:600;margin:0;line-height:1.15}
.selam p{margin:4px 0 0;color:var(--muted);font-size:18px}

/* ---------- WhatsApp gibi liste ---------- */
.liste{list-style:none;margin:0;padding:0}
.satir{display:flex;align-items:center;gap:14px;width:100%;min-height:80px;padding:12px 16px;border:0;background:transparent;text-align:left;border-bottom:1px solid var(--line)}
.liste>li:last-child .satir{border-bottom:0}
.satir:active{background:var(--surface-2)}
.satir .orta{flex:1;min-width:0}
.satir .orta b{display:block;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.satir .orta span{display:block;color:var(--muted);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.satir .sag{text-align:right;flex:none;font-size:15px;color:var(--muted)}
.satir .sag b{display:block;color:var(--accent);font-size:17px}
.satir .saat{flex:none;min-width:64px;font-size:22px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.satir-kap{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.satir-kap .satir{border-bottom:0;flex:1;min-width:0}
.liste>li.satir-kap:last-child{border-bottom:0}
.etiket{display:inline-block;border-radius:999px;padding:2px 10px;font-size:14px;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.etiket.ok{background:var(--ok-soft);color:var(--ok)}
.etiket.uyari{background:var(--warn-soft);color:var(--warn)}
.etiket.gul{background:var(--accent-soft);color:var(--accent)}

/* ---------- arama ve çipler ---------- */
.arama{position:relative;margin-top:14px}
.arama input{width:100%;min-height:60px;border-radius:999px;border:2px solid var(--line-2);background:var(--surface);padding:12px 20px 12px 52px;font-size:19px}
.arama .ico{position:absolute;left:18px;top:18px;color:var(--muted)}
.cipler{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.cip{min-height:48px;padding:8px 18px;border-radius:999px;border:2px solid var(--line-2);background:var(--surface);font-weight:650;font-size:17px}
.cip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* ---------- boş durum çizimleri ---------- */
.bos{text-align:center;padding:26px 16px 22px}
.bos .cizim{width:130px;height:110px;margin:0 auto 10px;color:var(--accent)}
.bos .cizim svg{width:100%;height:100%}
.bos b{display:block;font-size:20px}
.bos p{margin:6px 0 16px;color:var(--muted)}

/* ---------- sabit yeni butonu ---------- */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom,0px));z-index:25;
  min-height:64px;padding:0 24px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font-size:19px;font-weight:750;display:flex;align-items:center;gap:8px;box-shadow:0 10px 26px -10px rgba(184,58,99,.6)}
.fab .ico{width:28px;height:28px}

/* ---------- sayfa (üstte açılan pencere) ---------- */
.sayfa{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;animation:gir .22s cubic-bezier(.32,.72,0,1)}
@keyframes gir{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sayfa .ic-alt{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.geri{display:inline-flex;align-items:center;gap:4px;min-height:56px;padding:0 10px 0 2px;border:0;background:transparent;font-size:18px;font-weight:700;color:var(--accent)}
.geri .ico{width:30px;height:30px}
.alt-sabit{position:fixed;left:0;right:0;bottom:0;z-index:55;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px))}

/* ---------- profil ---------- */
.profil{text-align:center;padding:18px 0 4px}
.profil .av{margin:0 auto}
.profil-foto{border:0;background:transparent;padding:0;position:relative}
.profil-foto .kam{position:absolute;right:2px;bottom:2px;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;border:3px solid var(--bg)}
.profil-foto .kam .ico{width:20px;height:20px}
.profil h2{font-family:var(--f-display);font-size:30px;font-weight:600;margin:12px 0 2px;line-height:1.15}
.gizli-ad{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:16px;background:var(--surface-2);border-radius:999px;padding:4px 12px;margin-top:4px}
.gizli-ad .ico{width:16px;height:16px}
.profil .alt-bilgi{color:var(--muted);font-size:17px;margin-top:6px}
.sayilar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 14px}
.sayilar div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 6px;text-align:center}
.sayilar b{display:block;font-size:24px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.sayilar span{font-size:15px;color:var(--muted)}
.sayilar .gul b{color:var(--accent)}
.sayilar .ok b{color:var(--ok)}

/* ---------- prova kutusu ---------- */
.siradaki{padding:18px;border-radius:var(--r-l);background:var(--accent-soft);border:0}
.siradaki .ust-yazi{font-size:16px;font-weight:700;color:var(--accent)}
.siradaki .tarih{font-family:var(--f-display);font-size:28px;font-weight:600;margin:2px 0 2px;line-height:1.2}
.siradaki .not{color:var(--ink-2);font-size:17px;margin-bottom:12px}
.gecmis{list-style:none;margin:10px 0 0;padding:0}
.gecmis li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:17px}
.gecmis li:first-child{border-top:0}
.gecmis .nokta{width:12px;height:12px;border-radius:50%;background:var(--line-2);margin-top:7px;flex:none}
.gecmis .nokta.ok{background:var(--ok)}
.gecmis .nokta.gul{background:var(--accent)}
.gecmis small{display:block;color:var(--muted);font-size:15px}
.ustu-cizili{text-decoration:line-through;color:var(--muted)}

/* ---------- foto ızgarası ---------- */
.izgara{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border-radius:var(--r-m);overflow:hidden}
.izgara button{border:0;padding:0;background:var(--sunk);aspect-ratio:3/4;overflow:hidden}
.izgara img{width:100%;height:100%;object-fit:cover}
.model-izgara{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.model-kart{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-l);overflow:hidden;padding:0;text-align:left}
.model-kart .resim{aspect-ratio:3/4;background:var(--sunk);display:grid;place-items:center;color:var(--muted)}
.model-kart .resim img{width:100%;height:100%;object-fit:cover}
.model-kart .yazi{padding:10px 12px 12px}
.model-kart b{display:block;font-size:18px;line-height:1.2}
.model-kart span{font-size:15px;color:var(--muted)}

/* ---------- form ---------- */
.alan{display:block;margin-top:16px}
.alan>span{display:block;font-weight:700;font-size:17px;margin-bottom:6px}
.alan>small{display:block;color:var(--muted);font-size:15px;margin-top:4px}
.girdi{width:100%;min-height:60px;border-radius:var(--r-m);border:2px solid var(--line-2);background:var(--surface);padding:12px 16px;font-size:19px}
textarea.girdi{min-height:110px;resize:vertical}
.girdi:focus{border-color:var(--accent);outline:none}
.secenek{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.secenek.dort{grid-template-columns:1fr 1fr}
.secenek button{min-height:56px;border-radius:var(--r-m);border:2px solid var(--line-2);background:var(--surface);font-weight:700;font-size:17px;padding:6px}
.secenek button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.saatler{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.saatler button{min-height:52px;border-radius:var(--r-s);border:2px solid var(--line-2);background:var(--surface);font-weight:700;font-variant-numeric:tabular-nums}
.saatler button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.kutu-tik{display:flex;align-items:center;gap:14px;min-height:60px;padding:8px 4px;border-bottom:1px solid var(--line);width:100%;border-left:0;border-right:0;border-top:0;background:transparent;text-align:left;font-size:18px}
.kutu-tik:last-child{border-bottom:0}
.tik{width:34px;height:34px;border-radius:10px;border:2px solid var(--line-2);flex:none;display:grid;place-items:center;background:var(--surface)}
.tik .ico{width:22px;height:22px;opacity:0}
.kutu-tik[aria-checked="true"] .tik{background:var(--ok);border-color:var(--ok);color:#fff}
.kutu-tik[aria-checked="true"] .tik .ico{opacity:1}
.kutu-tik small{display:block;color:var(--muted);font-size:14px}
.girdi.supheli{border-color:var(--warn);background:var(--warn-soft)}
.hata{color:var(--bad);font-weight:650;margin-top:10px;min-height:1px}

/* ---------- ödeme ---------- */
.odeme-ozet{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:6px}
.odeme-ozet b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.odeme-ozet span{font-size:15px;color:var(--muted)}
.cubuk{height:12px;border-radius:999px;background:var(--sunk);overflow:hidden;margin:12px 0 4px}
.cubuk i{display:block;height:100%;background:var(--ok);border-radius:999px}

/* ---------- beden çizimi ---------- */
.beden{position:relative;width:100%;max-width:420px;margin:8px auto 0;aspect-ratio:300/560}
.beden svg{position:absolute;inset:0;width:100%;height:100%}
.beden .govde{fill:var(--surface-2);stroke:var(--line-2);stroke-width:2}

.olcu-btn.dolu{border-color:var(--ok)}
.olcu-btn.dolu b{color:var(--ink)}
.olcu-btn.degisti{border-color:var(--warn);background:var(--warn-soft)}
.olcu-btn.aktif{border-color:var(--accent);background:var(--accent);box-shadow:0 8px 20px -8px rgba(184,58,99,.6)}
.olcu-btn.aktif span,.olcu-btn.aktif b{color:var(--accent-ink)}

.olcu-btn.sag{right:0}

.tuslar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.ekran-sayi{font-size:40px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1;margin:2px 0 8px}
.ekran-sayi small{font-size:24px;color:var(--muted);font-weight:700}

.sor-alt textarea{flex:1;min-height:60px;max-height:140px;border-radius:28px;padding:16px 20px;resize:none}

.pin-noktalar.salla{animation:salla .35s}

.tuslar.pin button{min-height:72px;font-size:32px;border-radius:50%;width:84px;height:84px;margin:0 auto}
.tuslar.pin .bos-tus{visibility:hidden}

/* ---------- foto görüntüleyici ---------- */
.goster{position:fixed;inset:0;z-index:90;background:#000;display:flex;flex-direction:column}
.goster .resim{flex:1;display:grid;place-items:center;overflow:hidden}
.goster img{max-width:100%;max-height:100%;object-fit:contain}
.goster .alt-btn{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.goster .alt-btn .btn{background:#2a2a2a;border-color:#2a2a2a;color:#fff;font-size:16px}

.bildirim{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 24px + env(safe-area-inset-bottom,0px));z-index:100;

.yukleniyor div{background:var(--surface);border-radius:20px;padding:22px 28px;font-size:19px;font-weight:700;display:flex;align-items:center;gap:14px}
.donen{width:28px;height:28px;border-radius:50%;border:4px solid var(--line-2);border-top-color:var(--accent);animation:don 1s linear infinite}
@keyframes don{to{transform:rotate(360deg)}}
.acilis{min-height:100vh;display:grid;place-items:center}
.yardim-adim{display:flex;gap:12px;align-items:flex-start;padding:10px 0}

let bildirimZaman;

/** Sunucuya işlem gönderir, veriyi tazeler. Hata olursa söyler, false döner. */
async function islem(fn, args, mesaj){

/* ---------------- gezinme: üst üste açılan sayfalar, telefonun geri tuşu kapatır ---------------- */
const TARIH_GECMISI = (window.google && google.script && google.script.history)
  ? { it:d=>google.script.history.push({d}), dinle:fn=>google.script.history.setChangeHandler(e=>fn(e.state)) }
  : { it:d=>history.pushState({d},''), dinle:fn=>window.addEventListener('popstate',e=>fn(e.state)) };
const SAYFA = {}; // tip -> kurucu fonksiyon (Ekranlar, Kart, Olcu dosyalarında doldurulur)
function ac(o){ S.yigin.push(o); TARIH_GECMISI.it(S.yigin.length); yiginCiz(); }
function kapat(o){
  const i = S.yigin.indexOf(o); if (i<0) return;
  const bekleyen = S.yigin.length;
  history.back();
  // Geri gelmezse (bazı tarayıcılarda) elle kapat.
  setTimeout(()=>{ if (S.yigin.length===bekleyen && S.yigin.indexOf(o)>=0) yiginKes(i); }, 400);
}
/** d. sayfadan sonrasını kapatır. kapaninca, sayfalar gerçekten kapandıktan sonra çağrılır. */
function yiginKes(d){
  const kapanan = S.yigin.splice(d);
  yiginCiz();
  kapanan.forEach(o=>o.kapaninca && o.kapaninca());
}
TARIH_GECMISI.dinle(st=>{
  const d = (st && st.d) || 0;
  if (S.yigin.length > d) yiginKes(d);
});
function yiginKur(o){
  if (o.tip==='panel'){
    const kapatFn = ()=>kapat(o);
    const p = el('div',{class:'panel',role:'dialog','aria-modal':'true'}, el('div',{class:'tutamak'}), ...o.kur(kapatFn, o).filter(Boolean));
    return el('div',{class:'perde',onclick:e=>{ if(e.target===e.currentTarget) kapatFn(); }}, p);
  }
  return SAYFA[o.tip](o);
}
function yiginCiz(){
  const kap = $('yigin');
  const kaydirma = [...kap.children].map(c=>c.scrollTop || (c.firstChild && c.firstChild.scrollTop) || 0);
  kap.replaceChildren(...S.yigin.map(yiginKur));
  [...kap.children].forEach((c,i)=>{ if (kaydirma[i]){ c.scrollTop=kaydirma[i]; if(c.firstChild) c.firstChild.scrollTop=kaydirma[i]; } });

/* ---------------- veri ---------------- */
function veriAl(v){
  if (!v || !v.me) return;
  S.v = v; S.me = v.me;
  const imza = JSON.stringify([v.kayitlar[0]&&v.kayitlar[0].at, v.gelinler.length, v.provalar.length, v.fotograflar.length, v.personel.length]);
  const degisti = imza !== S.imza; S.imza = imza;
  if (v.sonFoto) S.kucuk[v.sonFoto.id] = v.sonFoto.kucuk;
  if (degisti || !$('uygulama').hidden) hepsiniCiz();
}
async function tazele(){
  if (!S.token || document.hidden || S.yigin.some(o=>o.duzenleme || o.tip==='panel')) return;
  try{ const v=await api('veri', S.token); const once=S.imza; S.v=v; S.me=v.me;
    const imza = JSON.stringify([v.kayitlar[0]&&v.kayitlar[0].at, v.gelinler.length, v.provalar.length, v.fotograflar.length, v.personel.length]);
    if (imza!==once){ S.imza=imza; hepsiniCiz(); } }catch(e){}
}
setInterval(tazele, YENILEME_MS);

const gelin = id => S.v.gelinler.find(g=>g.id===id);
const model = id => S.v.modeller.find(m=>m.id===id);
function randevular(gid){ return S.v.provalar.filter(p=>p.gelinId===gid).sort((a,b)=>(a.tarih+a.saat).localeCompare(b.tarih+b.saat)); }
function siradaki(gid){ const b=bugun(); return randevular(gid).find(p=>p.durum==='planli' && p.tarih>=b) || null; }
function provaSirasi(p){ return randevular(p.gelinId).filter(x=>x.tur==='prova' && x.durum!=='iptal').indexOf(p)+1; }
function olcuGecmisi(gid){ return S.v.olculer.filter(o=>o.gelinId===gid).sort((a,b)=>b.at-a.at); }
function sonOlcu(gid){
  const birlesik = {}; olcuGecmisi(gid).slice().reverse().forEach(o=>Object.assign(birlesik,o.degerler));

}
function odemeOzet(g){
  const ls = S.v.odemeler.filter(o=>o.gelinId===g.id).sort((a,b)=>(b.tarih||'').localeCompare(a.tarih||''));
  const alinan = ls.reduce((s,o)=>s+(o.tur==='iade'?-1:1)*o.tutar,0);
  return { liste:ls, alinan, kalan: Math.max(0,(g.fiyat||0)-alinan), fiyat:g.fiyat||0 };
}
const gelinFotolari = gid => S.v.fotograflar.filter(f=>f.sahip==='gelin'&&f.sahipId===gid).sort((a,b)=>b.at-a.at);
const modelFotolari = mid => S.v.fotograflar.filter(f=>f.sahip==='model'&&f.sahipId===mid).sort((a,b)=>b.at-a.at);
function ozetGoster(s){ return String(s||'').replace(/\d{4}-\d{2}-\d{2}/g, t=>tarihKisa(t)); }
function randevuYazi(p){ return gunAdi(p.tarih)+(p.saat?' '+p.saat:''); }

const bekleyenFoto = new Set(); let fotoZaman;

/* ---------------- fotoğraf hazırlama: büyük hali ve tabloya sığan küçük önizleme ---------------- */
const BUYUK_PX = 1600, KUCUK_PX = 360, KUCUK_SINIR = 44000;
async function bitmapAl(file){
  try{ return await createImageBitmap(file, {imageOrientation:'from-image'}); }
  catch(e){
    return await new Promise((res,rej)=>{ const u=URL.createObjectURL(file); const i=new Image();
      i.onload=()=>{ URL.revokeObjectURL(u); res(i); }; i.onerror=()=>rej(new Error('Fotoğraf açılamadı.')); i.src=u; });
  }
}
function tuvalB64(src, enCok, kalite){
  const w=src.width, h=src.height, k=Math.min(1, enCok/Math.max(w,h));
  const c=el('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg', kalite).split(',')[1];
}
async function fotoHazirla(file){
  if (!file || !/^image\//.test(file.type||'image/')) throw new Error('Sadece fotoğraf seçilebilir.');
  const bmp = await bitmapAl(file);
  const b64 = tuvalB64(bmp, BUYUK_PX, 0.82);
  let kalite=0.72, kucuk=tuvalB64(bmp, KUCUK_PX, kalite);
  while (kucuk.length>KUCUK_SINIR && kalite>0.3){ kalite-=0.12; kucuk=tuvalB64(bmp, KUCUK_PX, kalite); }
  bmp.close && bmp.close();
  return { b64, kucuk, tip:'image/jpeg' };
}
/** Kamera ya da galeri açar, seçilen fotoğrafı hazırlayıp geri verir. */
function fotoSec(kamera){
  return new Promise(res=>{
    const inp = el('input',{type:'file',accept:'image/*',style:'display:none'});
    if (kamera) inp.setAttribute('capture','environment');
    inp.addEventListener('change', async ()=>{
      const f = inp.files && inp.files[0]; inp.remove();
      if (!f) return res(null);
      bekle('Fotoğraf hazırlanıyor…');
      try{ res(await fotoHazirla(f)); }catch(e){ bildir(e.message); res(null); }
      finally{ bekleBitti(); }
    });
    document.body.append(inp); inp.click();
  });
}

async function baslat(){

  if (S.token){
    try{ veriAl(await api('veri', S.token)); uygulamayiAc(); return; }catch(e){}
  }

async function girisiAc(){

  if (r.ilkKurulum) return ilkKurulumCiz(kap);

    el('h2',{style:'text-align:center;font-size:22px;margin:0 0 14px',text:'Adına dokun'}),

}
function markaBas(){ return el('div',{class:'marka'}, cizim('gelinlik'), el('h1',{text:DUKKAN}), el('p',{text:'Gelin defteri'})); }
function pinTuslari(ekle, sil){
  const t=[1,2,3,4,5,6,7,8,9].map(n=>el('button',{type:'button',onclick:()=>ekle(String(n))},String(n)));

    el('button',{type:'button',onclick:()=>ekle('0')},'0'), el('button',{type:'button',class:'sil',onclick:sil,'aria-label':'Sil'},'Sil'));
}
function pinCiz(kap, k){
  let pin='';
  const uz = k.pinUz || 4;
  const noktalar = el('div',{class:'pin-noktalar','aria-label':'Şifre, '+uz+' rakam'}, ...Array.from({length:uz},()=>el('i')));
  const hata = el('p',{class:'hata',style:'text-align:center'});
  const ciz = ()=>[...noktalar.children].forEach((n,i)=>n.className=i<pin.length?'dolu':'');
  const gonder = async ()=>{
    bekle('Giriş yapılıyor…');
    try{ const r=await api('giris', k.id, pin); S.token=r.token; sakla(TKEY,r.token); veriAl(r.veri); uygulamayiAc(); }
    catch(e){ hata.textContent=e.message; pin=''; ciz(); noktalar.classList.remove('salla'); void noktalar.offsetWidth; noktalar.classList.add('salla'); }
    finally{ bekleBitti(); }
  };
  kap.replaceChildren(el('div',{class:'wrap giris'},
    el('div',{class:'marka'}, el('span',{style:'display:inline-block'}, kisiAvatar(k,true)),
      el('h1',{style:'font-size:30px',text:k.ad}), el('p',{text:uz+' rakamlı şifreni gir'})),
    noktalar, hata,
    pinTuslari(d=>{ if(pin.length<uz){ pin+=d; hata.textContent=''; ciz(); if(pin.length===uz) gonder(); } }, ()=>{ pin=pin.slice(0,-1); ciz(); }),
    el('div',{class:'btn-sira',style:'margin-top:22px'},
      el('button',{class:'btn',type:'button',onclick:girisiAc},'Başka biriyim'),
      el('button',{class:'btn',type:'button',onclick:()=>sifremiUnuttum(k)},'Şifremi unuttum'))));
}
const YONETICI_WA = ''; // Çağatay'ın WhatsApp numarası (örnek 905321234567). Boşsa WhatsApp'ta kişi seçilir.
function sifremiUnuttumMetni(k){ return 'Merhaba Çağatay, '+DUKKAN+' uygulamasında şifremi unuttum. Adım: '+k.ad+'. Sıfırlar mısın?'; }
function sifremiUnuttum(k){

  ac({tip:'panel', kur:(kapatFn)=>[el('h3',{text:'Şifreni mi unuttun?'}),

      el('button',{class:'btn ana tam',type:'button',onclick:async()=>{ bekle('Gönderiliyor…');
        try{ await api('sifreTalebi', k.id); kapatFn(); bildir('Çağatay\'a haber verildi. Yeni şifren gelince gir.'); }
        catch(e){ bildir(e.message); } finally{ bekleBitti(); } }}, ikon('zil'), 'Çağatay\'a haber ver'),
      el('button',{class:'btn wa tam',type:'button',onclick:async()=>{ await kopyala(metin); waAc(YONETICI_WA, metin); }}, ikon('wa'), 'WhatsApp\'tan yaz')),
    el('p',{class:'aciklama',style:'margin-top:14px',text:'WhatsApp\'ta şu mesaj hazır gelir: "'+metin+'"'})]});
}
function ilkKurulumCiz(kap){
  const ad = el('input',{class:'girdi',autocomplete:'name',placeholder:'Örnek: Perihan'});
  const pin = el('input',{class:'girdi',inputmode:'numeric',maxlength:'6',placeholder:'4 ile 6 rakam',type:'password'});

  kap.replaceChildren(el('div',{class:'wrap giris'}, markaBas(),

      el('button',{class:'btn ana tam',type:'button',style:'margin-top:16px',onclick:async()=>{
        bekle('Kuruluyor…');
        try{ const r=await api('ilkKurulum', ad.value, pin.value); S.token=r.token; sakla(TKEY,r.token); veriAl(r.veri); uygulamayiAc(); }
        catch(e){ hata.textContent=e.message; } finally{ bekleBitti(); }
      }},'Kurulumu bitir'))));
}
function uygulamayiAc(){
  $('acilis').hidden=true; $('giris').hidden=true; $('uygulama').hidden=false; hepsiniCiz();
  if (S.me && S.me.pinDegismeli && !S.pinSoruldu){ S.pinSoruldu=true;
    setTimeout(async()=>{ if (await onay('Kendi şifreni belirle','Şu an herkesin şifresi aynı. Kendine yeni bir şifre belirlersen senin adına kimse giremez.','Şimdi belirle')) pinDegistirAc(); }, 600); }
}
function cikisYap(sessiz){
  const t=S.token; S.token=null; S.me=null; S.v=null; S.yigin=[]; S.sekme='bugun'; S.sohbet=[]; yiginCiz(); sakla(TKEY,null);
  if (t && !sessiz) google.script.run.cikis(t);
  girisiAc();
}

<script>

  { k:'bugun', ad:'Bugün', ikon:'takvim' },

function hepsiniCiz(){
  if (!S.v) return;
  $('baslik').textContent = SEKMELER.find(s=>s.k===S.sekme).ad;
  $('ayarBtn').replaceChildren(ikon('ayar'), 'Ayarlar');
  $('ayarBtn').onclick = ()=>ac({tip:'ayarlar'});
  zilCiz();
  const sekme = s=>el('button',{class:'sekme',type:'button','aria-current':S.sekme===s.k?'page':null,
    onclick:()=>{ S.sekme=s.k; window.scrollTo(0,0); hepsiniCiz(); }}, ikon(s.ikon), s.ad);
  $('sekmeler').replaceChildren(sekme(SEKMELER[0]), sekme(SEKMELER[1]),
    el('button',{class:'sekme sor-sekme',type:'button','aria-label':'Sor, konuşarak ya da yazarak',onclick:()=>ac({tip:'sor'})}, el('span',{class:'sor-daire'}, ikon('mik')), 'Sor'),
    sekme(SEKMELER[2]));
  const ana = $('ana');
  ana.replaceChildren(...({ bugun:bugunCiz, gelinler:gelinlerCiz, modeller:modellerCiz }[S.sekme])());
  if (!S.yigin.some(o=>o.duzenleme)) yiginCiz();
}

  const g = gelin(p.gelinId);
  const sira = p.tur==='prova' ? provaSirasi(p)+'. prova' : RANDEVU_AD[p.tur];
  return el('li',{class:'satir-kap'},
    el('button',{class:'satir',type:'button',onclick:()=>ac({tip:'gelin',id:g.id})},

      avatar(g),

/* ---------------- Bugün ---------------- */
function selamSozu(){ const h=new Date().getHours(); return h<11?'Günaydın':h<18?'İyi günler':'İyi akşamlar'; }
function bugunCiz(){
  const b = bugun(), v = S.v;
  const planli = v.provalar.filter(p=>p.durum==='planli' && gelin(p.gelinId));
  const saatSira = (a,c)=>(a.tarih+(a.saat||'99')).localeCompare(c.tarih+(c.saat||'99'));
  const bugunR = planli.filter(p=>p.tarih===b).sort(saatSira);
  const yarinR = planli.filter(p=>p.tarih===gunEkle(b,1)).sort(saatSira);

  const parcalar = [
    el('div',{class:'selam'}, el('h2',{text:selamSozu()+' '+S.me.ad}), el('p',{text:tarihUzun(b)})),
    bugunR.length
      ? el('div',{class:'hikayeler',role:'list','aria-label':'Bugün gelecekler'}, ...bugunR.map(p=>{ const g=gelin(p.gelinId);
          return el('button',{class:'hikaye',type:'button',role:'listitem',onclick:()=>ac({tip:'gelin',id:g.id})},
            el('span',{class:'halka'}, avatar(g)), el('b',{text:ilkAd(g.ad)}), el('small',{text:p.saat||'Bugün'})); }))
      : null,
    el('div',{class:'btn-sira',style:'margin-top:14px'},
      el('button',{class:'btn ana',type:'button',onclick:()=>ac({tip:'yeniGelin',duzenleme:true})}, ikon('arti'), 'Yeni gelin'),
      el('button',{class:'btn yumusak',type:'button',onclick:()=>formdanBaslat()}, ikon('kamera'), 'Formdan ekle')),
    el('div',{class:'btn-sira',style:'margin-top:10px'},
      el('button',{class:'btn studyo-btn',type:'button',onclick:()=>studyoAc()}, ikon('yildiz'), 'Stüdyo'),
      el('button',{class:'btn',type:'button',onclick:()=>ac({tip:'qr'})}, ikon('qr'), 'Instagram QR'))
  ];
  parcalar.push(bolum('Bugün gelecekler', bugunR.length||null, bugunR.length ? liste(bugunR.map(p=>randevuSatiri(p)))
    : el('div',{class:'kart'}, bosDurum('takvim','Bugün kimse gelmiyor','Randevu, gelinin kartından verilir.'))));
  if (yarinR.length) parcalar.push(bolum('Yarın gelecekler: hatırlat', yarinR.length, liste(yarinR.map(p=>randevuSatiri(p,{hatirlat:true})))));
  const isler = bugunIsleri().filter(x=>x.sayi>0);
  if (isler.length) parcalar.push(bolum('Diğer işler', null, el('div',{class:'kareler',style:'margin-top:0'}, ...isler.map(x=>
    el('button',{class:'kare'+(x.uyari?' uyari':''),type:'button',onclick:()=>ac({tip:'isListesi',k:x.k})},
      el('span',{class:'kare-ikon'}, ikon(x.ikon)), el('b',{text:x.ad}), el('span',{text:x.sayi+' '+x.birim}))))));
  return parcalar;
}
/** Bugün ekranındaki "Diğer işler" kareleri. Her biri dokununca liste sayfası açılır. */
function bugunIsleri(){
  const b = bugun(), v = S.v;
  const planli = v.provalar.filter(p=>p.durum==='planli' && gelin(p.gelinId));
  const saatSira = (a,c)=>(a.tarih+(a.saat||'99')).localeCompare(c.tarih+(c.saat||'99'));
  const aktif = v.gelinler.filter(g=>g.durum==='aktif');
  const unutulan = planli.filter(p=>p.tarih<b && p.tarih>=gunEkle(b,-14)).sort(saatSira);
  const hafta = planli.filter(p=>p.tarih>gunEkle(b,1) && p.tarih<=gunEkle(b,7)).sort(saatSira);
  const teslim = aktif.filter(g=>{ const t=g.teslimTarihi||g.dugunTarihi; const f=gunFark(t); return t && f>=0 && f<=7; })
    .sort((a,c)=>(a.teslimTarihi||a.dugunTarihi).localeCompare(c.teslimTarihi||c.dugunTarihi));
  const iade = v.gelinler.filter(g=>g.tur==='kiralik' && g.durum==='teslim' && g.iadeTarihi && gunFark(g.iadeTarihi)<=2);
  const tebrik = v.gelinler.filter(g=>g.durum!=='iptal' && !g.anonim && (g.dugunTarihi===gunEkle(b,-1) || g.dugunTarihi===b));
  const tadilat = v.istekler.filter(i=>i.durum!=='bitti' && gelin(i.gelinId) && gelin(i.gelinId).durum==='aktif');
  return [
    { k:'unutulan', ad:'Yapıldı mı?', ikon:'tik', birim:'işaretlenmemiş', sayi:unutulan.length, uyari:true,
      satirlar:()=>unutulan.map(p=>randevuSatiri(p,{gunlu:true})), aciklama:'Geçmiş randevular. Gelin geldiyse kartından "Yapıldı" de.' },
    { k:'hafta', ad:'Bu hafta', ikon:'takvim', birim:'randevu', sayi:hafta.length, satirlar:()=>hafta.map(p=>randevuSatiri(p,{gunlu:true})) },
    { k:'teslim', ad:'Teslim', ikon:'gelinlik', birim:'yaklaşıyor', sayi:teslim.length, satirlar:()=>teslim.map(g=>{ const t=g.teslimTarihi||g.dugunTarihi;
      return gelinSatiri(g, (g.teslimTarihi?'Teslim ':'Düğün ')+tarihUzun(t), el('span',{class:'sag'}, el('b',{text:kalanYazi(t)}))); }) },
    { k:'iade', ad:'İade', ikon:'aski', birim:'kiralık bekleniyor', sayi:iade.length, satirlar:()=>iade.map(g=>gelinSatiri(g,'İade '+tarihUzun(g.iadeTarihi), el('span',{class:'sag'}, el('b',{text:kalanYazi(g.iadeTarihi)})))) },
    { k:'tebrik', ad:'Mutluluklar', ikon:'wa', birim:'düğün', sayi:tebrik.length, satirlar:()=>tebrik.map(g=>el('li',{class:'satir-kap'},
      el('button',{class:'satir',type:'button',onclick:()=>ac({tip:'gelin',id:g.id})}, avatar(g), el('span',{class:'orta'}, el('b',{text:g.ad}), el('span',{text:'Düğün '+gunAdi(g.dugunTarihi).toLocaleLowerCase('tr')}))),
      el('button',{class:'btn wa kucuk',type:'button',style:'margin-right:12px',onclick:()=>mesajAc(g,null,'Mutluluklar')}, ikon('wa'), 'Gönder'))) },
    { k:'tadilat', ad:'Tadilatlar', ikon:'kalem', birim:'iş bekliyor', sayi:tadilat.length, satirlar:()=>tadilat.map(i=>gelinSatiri(gelin(i.gelinId), i.metin, el('span',{class:'sag',text:once(i.at)}))) }
  ];
}
SAYFA.isListesi = function(o){
  const x = bugunIsleri().find(y=>y.k===o.k);

/* ---------------- Gelinler ---------------- */
function gelinEslesir(g, q){
  if (!q) return true;
  const qd = q.replace(/\D/g,'');
  return [g.ad, g.digerIsim, g.damatAd, g.modelAd, g.modelKod].some(x=>norm(x).includes(q)) || (qd.length>=4 && (g.telefon+g.damatTelefon).includes(qd));
}
function gelinAltYazi(g){
  const r = siradaki(g.id);
  if (r) return RANDEVU_AD[r.tur]+': '+randevuYazi(r);
  if (g.durum==='teslim') return g.tur==='kiralik' ? 'Teslim edildi, iade bekleniyor' : 'Teslim edildi';
  if (g.durum==='iade') return 'İade alındı';
  if (g.durum==='iptal') return 'İptal';
  return [TUR_AD[g.tur], g.modelAd].filter(Boolean).join(' · ');
}
function gelinlerCiz(){
  const q = norm(S.filtre.q);
  const ls = S.v.gelinler.filter(g=>(S.filtre.durum==='hepsi' || (S.filtre.durum==='aktif' ? g.durum==='aktif' : g.durum!=='aktif')) && gelinEslesir(g,q));
  const anahtar = g=>{ const r=siradaki(g.id); const t=(r?r.tarih:'')||g.dugunTarihi||''; return !t ? '99' : t<bugun() ? '9'+t : t; };
  ls.sort((a,b)=>S.filtre.durum==='aktif' ? anahtar(a).localeCompare(anahtar(b)) : b.guncellendi-a.guncellendi);
  const ara = el('input',{type:'search',placeholder:'İsim, diğer isim, damat adı',value:S.filtre.q,'aria-label':'Gelin ara',
    oninput:e=>{ S.filtre.q=e.target.value; const yeni=gelinlerCiz(); $('ana').replaceChildren(...yeni); const i=$('ana').querySelector('input'); i.focus(); i.setSelectionRange(i.value.length,i.value.length); }});
  const cip = (k,ad)=>el('button',{class:'cip',type:'button','aria-pressed':String(S.filtre.durum===k),onclick:()=>{ S.filtre.durum=k; hepsiniCiz(); }}, ad);
  return [
    el('div',{class:'arama'}, ikon('ara'), ara),
    el('div',{class:'cipler'}, cip('aktif','Aktif'), cip('bitti','Teslim edilenler'), cip('hepsi','Hepsi')),
    el('div',{class:'kart',style:'margin-top:14px'}, ls.length
      ? el('ul',{class:'liste'}, ...ls.map(g=>gelinSatiri(g, gelinAltYazi(g), g.dugunTarihi && gunFark(g.dugunTarihi)>=0
          ? el('span',{class:'sag'}, 'Düğüne', el('b',{text:gunFark(g.dugunTarihi)===0?'bugün':gunFark(g.dugunTarihi)+' gün'})) : el('span',{class:'sag',text:tarihKisa(g.dugunTarihi)}))))
      : bosDurum('gelinlik', q?'Bulamadım':'Henüz gelin yok', q?'Başka türlü yazmayı dene ya da Sor butonunu kullan.':'İlk gelini ekleyerek başla.',
          q?null:el('button',{class:'btn ana',type:'button',onclick:()=>ac({tip:'yeniGelin',duzenleme:true})}, ikon('arti'), 'Yeni gelin'))),
    el('button',{class:'fab',type:'button',onclick:()=>ac({tip:'yeniGelin',duzenleme:true})}, ikon('arti'), 'Yeni gelin')
  ];
}

function pinPanel(baslik, aciklama, gonder){

    const tamam = el('button',{class:'btn ana tam',type:'button',style:'margin-top:14px',disabled:true,onclick:()=>{ const p=pin; kapatFn(); setTimeout(()=>gonder(p),450); }}, ikon('tik'), 'Tamam');

    ciz();
    return [el('h3',{text:baslik}), el('p',{class:'aciklama',text:aciklama+' 4 ile 6 rakam.'}), n,
      pinTuslari(d=>{ if(pin.length<6){ pin+=d; ciz(); } }, ()=>{ pin=pin.slice(0,-1); ciz(); }), tamam];
  }});

/* ---------------- Sor: yazılı ve sesli asistan ---------------- */
let dinleyici = null;
SAYFA.sor = function(o){
  const sohbet = el('div',{class:'sohbet'});
  const metin = el('textarea',{class:'girdi',rows:'1',placeholder:'Sorunu yaz','aria-label':'Soru'});
  const mik = el('button',{class:'mik',type:'button','aria-label':'Sesli sor'}, ikon('mik'));
  const ciz = ()=>{
    const ogeler = S.sohbet.map(m=>el('div',{class:'balon '+(m.kim==='ben'?'ben':'ai')}, m.metin,
      ...(m.gelinIdler||[]).filter(gelin).map(id=>el('button',{class:'btn yumusak kucuk',type:'button',onclick:()=>ac({tip:'gelin',id})}, ilkAd(gelin(id).ad)+' kartını aç'))));
    if (!S.sohbet.length) ogeler.push(el('div',{}, bosDurum('sohbet','Bana sor','Gelinlerle ilgili ne merak ediyorsan sor. Yazabilir ya da konuşabilirsin.'),
      el('div',{class:'ornek-sorular'}, ...ORNEK_SORULAR.map(s=>el('button',{type:'button',onclick:()=>gonder(s)}, s)))));
    if (o.bekliyor) ogeler.push(el('div',{class:'balon ai'}, el('span',{class:'yaziyor','aria-label':'Düşünüyor'}, el('i'),el('i'),el('i'))));
    sohbet.replaceChildren(...ogeler);
    setTimeout(()=>{ const s=sohbet.closest('.sayfa'); if(s) s.scrollTop=s.scrollHeight; },0);
  };
  const gonder = async (soru)=>{
    soru = String(soru||metin.value).trim(); if (!soru || o.bekliyor) return;
    metin.value=''; S.sohbet.push({kim:'ben',metin:soru}); o.bekliyor=true; ciz();
    try{ const r = await api('sor', S.token, soru, S.sohbet.slice(-7,-1)); S.sohbet.push({kim:'ai',metin:r.cevap,gelinIdler:r.gelinIdler}); }
    catch(e){ S.sohbet.push({kim:'ai',metin:e.message}); }
    o.bekliyor=false; ciz();
  };
  mik.onclick = ()=>sesliDinle(mik, metin, gonder);
  ciz();
  return el('div',{class:'sayfa'}, sayfaBas(o,'Sor', S.sohbet.length?el('button',{class:'geri',type:'button',onclick:()=>{ S.sohbet=[]; yiginCiz(); }},'Temizle'):null),
    el('div',{class:'wrap ic-alt'}, el('button',{class:'btn ana tam',type:'button',style:'margin-top:14px;min-height:68px;font-size:20px',onclick:()=>{ sesBaglami(); ac({tip:'konusma'}); }}, ikon('mik'), 'Konuşarak sor, sesli cevap versin'), sohbet),
    el('div',{class:'alt-sabit'}, el('div',{class:'wrap sor-alt'}, metin, mik,
      el('button',{class:'mik',type:'button','aria-label':'Gönder',style:'background:var(--ink)',onclick:()=>gonder()}, ikon('gonder')))));
};
function sesliDinle(mik, metin, gonder){
  const Tanima = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (dinleyici){ dinleyici.stop(); return; }
  if (!Tanima) return bildir('Bu telefonda sesli sorma yok. Klavyedeki mikrofon tuşuna basarak konuşabilirsin.');
  const d = new Tanima(); dinleyici = d;
  d.lang='tr-TR'; d.interimResults=true; d.continuous=false;
  mik.classList.add('dinliyor'); bildir('Dinliyorum, konuş…');
  d.onresult = e=>{ metin.value = [...e.results].map(r=>r[0].transcript).join(' '); };
  d.onerror = e=>{ bildir(e.error==='not-allowed'||e.error==='service-not-allowed' ? 'Mikrofon izni yok. Klavyedeki mikrofon tuşuyla da söyleyebilirsin.' : 'Duyamadım, tekrar dene.'); };
  d.onend = ()=>{ dinleyici=null; mik.classList.remove('dinliyor'); if (metin.value.trim()) gonder(); };
  try{ d.start(); }catch(e){ dinleyici=null; mik.classList.remove('dinliyor'); bildir('Klavyedeki mikrofon tuşuyla söyleyebilirsin.'); }
}

SAYFA.gelin = function(o){

  const provaToplam = rs.filter(p=>p.tur==='prova' && p.durum!=='iptal').length;

  const sag = g.anonim ? null : el('button',{class:'geri',type:'button',onclick:()=>ac({tip:'gelinForm',id:g.id,duzenleme:true})}, ikon('kalem'), 'Düzenle');
  return el('div',{class:'sayfa'}, sayfaBas(o,'', sag), el('div',{class:'wrap ic-alt'},
    el('div',{class:'profil'},
      el('button',{class:'profil-foto',type:'button','aria-label':'Profil fotoğrafını değiştir',onclick:()=>fotoEklePanel('gelin',g.id,true)}, el('span',{class:'halka',style:'width:116px;height:116px;display:inline-block'}, avatar(g,true)), el('span',{class:'kam'}, ikon('kamera'))),
      el('h2',{text:g.ad}),

      el('button',{class:'kare'+(k.uyari?' uyari':'')+(k.studyo?' studyo-kare':''),type:'button',onclick:()=>k.studyo ? studyoAc({mod:'gelin', gelinId:g.id, modelId:(g.modelId && model(g.modelId) && model(g.modelId).fotoId) ? g.modelId : null}) : ac({tip:'gelinBolum',id:g.id,bolum:k.k})},

    { k:'odeme', ad:'Ödeme', ikon:'para', ozet: od.fiyat ? (od.kalan ? para(od.kalan)+' kalan' : 'Ödendi') : 'Fiyat yok' },
    { k:'teslim', ad:'Teslim', ikon:'gelinlik', ozet: ls.filter(x=>x.tamam).length+'/'+ls.length+' hazır' },

function paylasMetni(g, sec){

    if (g.modelNot) s.push('Model notu: '+g.modelNot);

    if (g.tur==='kiralik' && g.iadeTarihi) s.push('İade: '+tarihUzun(g.iadeTarihi));

<script>

/* Çizim 300 x 560 birimlik. Sol yarının noktaları, sağ yarısı aynadan. */

function yumusakYol(noktalar){
  let d = 'M'+noktalar[0].join(',');
  for (let i=0;i<noktalar.length-1;i++){
    const p0=noktalar[Math.max(0,i-1)], p1=noktalar[i], p2=noktalar[i+1], p3=noktalar[Math.min(noktalar.length-1,i+2)];
    const c1=[p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6], c2=[p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];
    d += ' C'+c1.map(n=>n.toFixed(1)).join(',')+' '+c2.map(n=>n.toFixed(1)).join(',')+' '+p2.join(',');
  }

const GOVDE_YOLU = yumusakYol(SOL_YARI.concat(SOL_YARI.slice(0,-1).reverse().map(([x,y])=>[300-x,y])));
// Her ölçünün çizimdeki çizgisi, kutunun yeri (taraf ve yükseklik) ve bağ çizgisinin vardığı nokta.

function svgEl(tag, at){ const e=document.createElementNS(SVG_NS, tag); Object.entries(at).forEach(([k,v])=>e.setAttribute(k,v)); return e; }

SAYFA.olcu = function(o){

      el('div',{}, el('b',{style:'font-size:19px',text:'Form okundu'}), el('div',{class:'muted',text:okunan+' ölçü bulundu. Kontrol edip kaydet.'}))),
    r.okunamayanlar.length || Object.keys(o.supheli).length ? el('div',{class:'kart ic',style:'margin-top:14px;background:var(--warn-soft);border-color:transparent'},

<script>
/* KVKK: aydınlatma metni, bilgilendirme kaydı, saklama süresi dolanların silinmesi, bütün oturumları kapatma. */
// [köşeli parantezli] yerleri dükkanın resmi bilgileriyle doldurun. Metin taslaktır, bir hukukçuya okutulması önerilir.
const VERI_SORUMLUSU = '[Dükkanın resmi unvanı], [adresi], [telefonu]';

  DUKKAN+' Gelinlik olarak, gelinlik satışı, kiralaması ve dikimi hizmetini verebilmek için adınızı, telefon numaranızı, düğün tarihinizi, beden ölçülerinizi, prova fotoğraflarınızı, isteklerinizi ve ödeme bilgilerinizi kaydediyoruz.',

  'Bilgileriniz Google\'ın bulut hizmetlerinde (Google Tablolar, Google Drive ve ölçü formunu okuyan yapay zekâ) saklanır ve işlenir. Bu hizmetlerin sunucuları yurt dışında olabilir.',

].join('\n\n');
function aydinlatmaKisa(g){

    +'Bilgileriniz sadece gelinliğiniz için kullanılır, dükkan dışında kimseyle paylaşılmaz, Google\'ın bulut hizmetlerinde saklanır ve işiniz bittikten 2 yıl sonra silinir. '

        for (const g of dolan){ const v = await islem('anonimlestir',[g.id],'Siliniyor: '+g.ad); if (!v) break; }

    el('div',{}, el('b',{text:'Telefon kaybolursa'}),
      el('p',{class:'muted',style:'margin:2px 0 8px',text:'Senin dışındaki bütün telefonlardan çıkış yapılır. Herkes şifresiyle yeniden girer.'}),
      el('button',{class:'btn tam',type:'button',onclick:async()=>{ if(await onay('Bütün telefonlardan çıkış yapılsın mı?','Herkes şifresiyle tekrar girmek zorunda kalır.','Çıkış yaptır',true)){ const v=await islem('tumOturumlariKapat',[]); if(v) bildir('Bütün telefonlardan çıkış yapıldı.'); } }}, ikon('cikis'), 'Bütün telefonlardan çıkış yaptır'))));

SAYFA.aydinlatma = function(o){

    el('p',{class:'muted',style:'margin:14px 0 8px',text:'Gelinlere anlatılacak ya da gönderilecek metin. Köşeli parantezli yerler dükkanın resmi bilgileriyle doldurulmalı.'}),

<style>
/* Kolaylaştırma: kareler, ortadaki büyük Sor, adım adım yeni gelin, Instagram QR. */
.kareler{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.kare{min-height:116px;border-radius:var(--r-l);border:2px solid var(--line);background:var(--surface);padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;box-shadow:var(--sh-1)}
.kare:active{transform:scale(.98);background:var(--surface-2)}
.kare-ikon{width:46px;height:46px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:4px}
.kare-ikon .ico{width:26px;height:26px}
.kare b{font-size:19px;line-height:1.2}
.kare span{font-size:16px;color:var(--muted);line-height:1.25}
.kare.uyari{border-color:var(--warn)}
.kare.uyari .kare-ikon{background:var(--warn-soft);color:var(--warn)}
.sor-sekme{color:var(--accent)!important;position:relative}
.sor-daire{width:62px;height:62px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-30px;border:4px solid var(--surface);box-shadow:0 8px 20px -8px rgba(184,58,99,.6)}
.sor-daire .ico{width:30px;height:30px}
.tek .bolum-bas{display:none}
.tek .bolum{margin-top:14px}
.olcu-btn .durum{font-style:normal;font-size:12px;font-weight:800;color:var(--warn);line-height:1}
.adim-ust{display:flex;align-items:center;gap:12px;margin-top:14px}

<script>
/* ---------------- Instagram QR ---------------- */
SAYFA.qr = function(o){
  if (o.secili==null) o.secili = 0;
  const h = INSTAGRAM[o.secili];
  return el('div',{class:'sayfa'}, sayfaBas(o,'Instagram'), el('div',{class:'wrap ic-alt'},
    el('p',{class:'muted',style:'margin:14px 0 10px;text-align:center',text:'Müşteri kendi telefonunun kamerasını bu karenin üstüne tutsun.'}),
    secenek(INSTAGRAM.map((x,i)=>[i, x.ad.replace('Perihan Moda ','').replace('Perihan Moda','Gelinlik')]), ()=>o.secili, i=>{ o.secili=i; yiginCiz(); }, 'dort'),
    el('div',{class:'qr-kutu',role:'img','aria-label':h.ad+' Instagram QR kodu'},
      el('div',{html:h.svg}), el('b',{text:'@'+h.k}), el('span',{text:h.alt}))),
    el('div',{class:'alt-sabit'}, el('div',{class:'wrap btn-sira'},
      el('button',{class:'btn',type:'button',onclick:async()=>bildir(await kopyala(h.url)?'Link kopyalandı.':'Kopyalanamadı.')}, ikon('kopyala'), 'Linki kopyala'),
      el('button',{class:'btn ana',type:'button',onclick:()=>window.open(h.url,'_blank')}, 'Instagram\'da aç'))));
};

/* ---------------- adım adım yeni gelin ---------------- */
const YENI_ADIM_SAYI = 5;
SAYFA.yeniGelin = function(o){
  if (!o.f){ o.adim = 0; o.f = { ad:'', telefon:'', dugunTarihi:'', tur:'', kvkk:false, ilkProva:{ tur:'olcu', tarih:'', saat:'' } }; }
  const f = o.f;
  const git = n=>{ o.adim = Math.max(0, Math.min(YENI_ADIM_SAYI-1, n)); yiginCiz(); };
  const sonraki = ()=>{
    if (o.adim===0 && !f.ad.trim()) return bildir('Önce gelinin adını yaz.');
    if (o.adim===3 && !f.tur) return bildir('Birini seç.');
    git(o.adim+1);
  };
  const kaydet = async (randevulu)=>{
    if (randevulu && !f.ilkProva.tarih) return bildir('Önce günü seç ya da "Randevusuz kaydet"e bas.');
    const v = await islem('gelinKaydet',[Object.assign({}, f, { tur:f.tur||'satis', siparisTarihi:bugun(), siparisiAlan:S.me.ad, ilkProva: randevulu ? f.ilkProva : null })]);
    if (!v) return;
    bildir(ilkAd(f.ad)+' eklendi.');
    yerDegistir(o, {tip:'gelin', id:v.sonId});
  };
  const girdiKutusu = (k, ek)=>{
    const e = el('input', Object.assign({class:'girdi buyuk-girdi', oninput:ev=>{ f[k]=ev.target.value; }, onkeydown:ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); sonraki(); } }}, ek));
    e.value = f[k]; setTimeout(()=>e.focus(), 120); return e;
  };
  const adimlar = [
    ()=>[el('h2',{class:'soru',text:'Gelinin adı ne?'}), el('p',{class:'soru-alt',text:'Adını ve soyadını yaz.'}),
      girdiKutusu('ad',{autocomplete:'off',placeholder:'Örnek: Esra Yılmaz','aria-label':'Gelinin adı'}),
      el('div',{class:'kart ic',style:'margin-top:22px;display:flex;gap:14px;align-items:center'},
        el('span',{style:'color:var(--accent)'}, ikon('form')),
        el('span',{style:'flex:1'}, el('b',{text:'Kağıt formu dolu mu?'}), el('small',{class:'muted',style:'display:block;font-size:15px',text:'Fotoğrafını çek, bilgileri kendisi doldursun.'})),
        el('button',{class:'btn yumusak kucuk',type:'button',onclick:()=>{ kapat(o); setTimeout(()=>formdanBaslat(),450); }}, ikon('kamera'), 'Çek')),
      el('button',{class:'gec',type:'button',onclick:()=>yerDegistir(o,{tip:'gelinForm',duzenleme:true,f:null})},'Hepsini tek sayfada gir (detaylı)')],
    ()=>[el('h2',{class:'soru',text:ilkAd(f.ad)+' Hanım\'ın telefonu?'}), el('p',{class:'soru-alt',text:'WhatsApp\'tan hatırlatma bu numaraya gider.'}),
      girdiKutusu('telefon',{type:'tel',inputmode:'tel',placeholder:'0532 123 45 67','aria-label':'Telefon'}),
      el('button',{class:'gec',type:'button',onclick:()=>{ f.telefon=''; git(2); }},'Telefonu yok, sonra yazarım')],
    ()=>[el('h2',{class:'soru',text:'Düğün ne zaman?'}), el('p',{class:'soru-alt',text:'Takvimden günü seç.'}),
      tarihSecici(()=>f.dugunTarihi, t=>{ f.dugunTarihi=t; }, false),
      el('button',{class:'gec',type:'button',onclick:()=>{ f.dugunTarihi=''; git(3); }},'Henüz belli değil')],
    ()=>[el('h2',{class:'soru',text:'Satış mı, kiralık mı?'}), el('p',{class:'soru-alt',text:'Birine dokun.'}),
      el('div',{class:'secim-dikey'}, ...[['satis','Satış','Gelinliği satın alıyor'],['kiralik','Kiralık','Düğünden sonra geri getirecek'],['dikim','Özel dikim','Ona özel dikilecek']].map(([k,ad,alt])=>
        el('button',{type:'button','aria-pressed':String(f.tur===k),onclick:()=>{ f.tur=k; git(4); }}, el('b',{text:ad}), el('span',{text:alt}))))],
    ()=>[el('h2',{class:'soru',text:'Ne zaman gelecek?'}), el('p',{class:'soru-alt',text:'İlk randevuyu ver. Sonra da verebilirsin.'}),
      secenek(Object.entries(RANDEVU_AD), ()=>f.ilkProva.tur, k=>{ f.ilkProva.tur=k; }, 'dort'),
      alan('Gün', tarihSecici(()=>f.ilkProva.tarih, t=>{ f.ilkProva.tarih=t; }, true)),
      alan('Saat', saatSecici(()=>f.ilkProva.saat, s=>{ f.ilkProva.saat=s; })),
      el('div',{class:'kart ic',style:'margin-top:20px'}, tikSatiri('Bilgilerinin kaydedildiğini anlattım, onay verdi (KVKK)', 'Sonra da kartından işaretleyebilirsin.', f.kvkk, ()=>{ f.kvkk=!f.kvkk; yiginCiz(); }))]
  ];
  const son = o.adim===YENI_ADIM_SAYI-1;
  return el('div',{class:'sayfa'}, sayfaBas(o,'Yeni gelin'), el('div',{class:'wrap ic-alt'},
    el('div',{class:'adim-ust'}, el('span',{text:'Adım '+(o.adim+1)+' / '+YENI_ADIM_SAYI}), el('div',{class:'adim-cubuk'}, el('i',{style:'width:'+((o.adim+1)/YENI_ADIM_SAYI*100)+'%'}))),
    ...adimlar[o.adim]()),
    el('div',{class:'alt-sabit'}, el('div',{class:'wrap btn-sira'},
      o.adim>0 ? el('button',{class:'btn',type:'button',onclick:()=>git(o.adim-1)}, ikon('geri'), 'Önceki') : el('button',{class:'btn',type:'button',onclick:()=>kapat(o)}, 'Vazgeç'),
      son ? el('button',{class:'btn ana',type:'button',onclick:()=>kaydet(!!f.ilkProva.tarih)}, ikon('tik'), f.ilkProva.tarih?'Kaydet':'Randevusuz kaydet')
        : el('button',{class:'btn ana',type:'button',onclick:sonraki}, 'Devam'))));
};
</script>

<script>
/* Yapay zekâ stüdyosu. Gelinin fotoğrafı ve üretilen görseller sadece bu ekranda, bellekte durur. */
const STUDYO_MOD = {
  manken: { ad:'Mankende göster', alt:'Vitrindeki ya da katalogdaki gelinlik bir mankenin üstünde nasıl duruyor', ikon:'aski' },
  gelin: { ad:'Gelinin üstünde dene', alt:'Müşterinin fotoğrafıyla, gelinlik onun üstünde', ikon:'gelinlik' },
  post: { ad:'Instagram postu hazırla', alt:'Post ve hikâye ölçüsünde, açıklama yazısıyla', ikon:'galeri' }
};
const SAHNE_AD = { cekim:'Fotoğraf çekimi', salon:'Düğün salonunda', bahce:'Bahçe düğünü', vitrin:'Butikte' };
const EK_AD = { duvak:'Duvak', topuz:'Topuz saç', dalga:'Dalgalı saç', buket:'Gelin buketi', tac:'Taç', aksam:'Akşam ışığı', dogal:'Çok doğal makyaj', gulumse:'Gülümsesin' };
const EK_SINIRI = 3;

function studyoAc(ek){ ac(Object.assign({tip:'studyo', duzenleme:true}, ek||{})); }
function b64Kucuk(b64){
  return new Promise(res=>{ const i=new Image(); i.onload=()=>{ let k=0.7, s=tuvalB64(i, KUCUK_PX, k); while(s.length>KUCUK_SINIR && k>0.3){ k-=0.12; s=tuvalB64(i, KUCUK_PX, k); } res(s); }; i.onerror=()=>res(''); i.src='data:image/jpeg;base64,'+b64; });
}

SAYFA.studyo = function(o){
  if (!o.sahneler){ o.adim = o.adim || (o.mod ? 'elbise' : 'mod'); o.elbise = o.elbise || []; o.sahneler = o.mod==='post' ? ['vitrin'] : ['cekim','salon','bahce']; o.ekler = []; o.not = ''; o.sonuclar = []; }
  const git = a=>{ o.adim=a; yiginCiz(); window.scrollTo(0,0); };
  const govde = { mod:studyoModSec, elbise:studyoElbise, gelin:studyoGelin, sahne:studyoSahne, sonuc:studyoSonuc }[o.adim](o, git);
  return el('div',{class:'sayfa'}, sayfaBas(o, 'Stüdyo'), el('div',{class:'wrap ic-alt'}, ...govde.icerik), govde.alt || null);
};
function studyoModSec(o, git){
  return { icerik:[
    el('h2',{class:'soru',text:'Ne yapalım?'}),
    el('p',{class:'soru-alt',text:'Yapay zekâ gelinliğin fotoğrafından yeni fotoğraflar hazırlar.'}),
    el('div',{class:'studyo-sec'}, ...Object.entries(STUDYO_MOD).map(([k,m])=>el('button',{type:'button',onclick:()=>{ o.mod=k; if(k==='post') o.sahneler=['vitrin']; git('elbise'); }},
      el('span',{class:'kare-ikon'}, ikon(m.ikon)), el('span',{}, el('b',{text:m.ad}), el('span',{text:m.alt})))))
  ]};
}
function studyoElbise(o, git){
  const ms = S.v.modeller.filter(m=>m.aktif && m.fotoId);
  const ekle = async kamera=>{ if (o.elbise.length>=3) return bildir('En fazla 3 fotoğraf.'); const f=await fotoSec(kamera); if(f){ o.elbise.push(f); o.modelId=null; yiginCiz(); } };
  return { icerik:[
    el('h2',{class:'soru',text:'Hangi gelinlik?'}),
    el('p',{class:'soru-alt',text:'Vitrinden ya da katalogdan iyi ışıkta önden ve arkadan çek. Ya da kayıtlı bir modeli seç.'}),
    el('div',{class:'btn-sira'},
      el('button',{class:'btn ana',type:'button',onclick:()=>ekle(true)}, ikon('kamera'), 'Fotoğraf çek'),
      el('button',{class:'btn',type:'button',onclick:()=>ekle(false)}, ikon('galeri'), 'Galeriden')),
    o.elbise.length ? el('div',{class:'secilen-fotolar'}, ...o.elbise.map((f,i)=>el('figure',{}, el('img',{src:'data:image/jpeg;base64,'+f.kucuk,alt:'Gelinlik fotoğrafı '+(i+1)}),
      el('button',{type:'button','aria-label':'Kaldır',onclick:()=>{ o.elbise.splice(i,1); yiginCiz(); }},'×')))) : null,
    ms.length ? bolum('Ya da kayıtlı modellerden', null, el('div',{class:'model-izgara'}, ...ms.map(m=>el('button',{class:'model-kart',type:'button',
      style: o.modelId===m.id ? 'border:3px solid var(--accent)' : '', onclick:()=>{ o.modelId = o.modelId===m.id ? null : m.id; o.elbise=[]; yiginCiz(); }},
      el('div',{class:'resim'}, fotoImg(m.fotoId, m.ad)), el('div',{class:'yazi'}, el('b',{text:m.ad}), el('span',{text:m.kod||''})))))) : null
  ], alt: el('div',{class:'alt-sabit'}, el('div',{class:'wrap btn-sira'},
    el('button',{class:'btn',type:'button',onclick:()=>git('mod')}, ikon('geri'), 'Önceki'),
    el('button',{class:'btn ana',type:'button',onclick:()=>{ if(!o.elbise.length && !o.modelId) return bildir('Önce gelinliğin fotoğrafını çek ya da bir model seç.'); git(o.mod==='gelin'?'gelin':'sahne'); }}, 'Devam')))};
}
function studyoGelin(o, git){
  const g = o.gelinId && gelin(o.gelinId);
  return { icerik:[
    el('h2',{class:'soru',text:'Gelinin fotoğrafı'}),
    el('div',{class:'uyari-kutu'}, el('b',{text:'Önce geline sor (KVKK)'}),
      el('p',{style:'margin:6px 0 0',text:'"Fotoğrafınız, gelinliği üzerinizde görmeniz için Google\'ın yapay zekâsına gönderilecek. Dükkanda saklanmayacak, ekranı kapatınca silinecek. Kabul ediyor musunuz?"'})),
    el('div',{class:'kart ic',style:'margin-top:12px'}, tikSatiri((g?ilkAd(g.ad)+' Hanım':'Gelin')+' kabul etti', 'Kabul etmezse bu adımı yapma.', o.onay, ()=>{ o.onay=!o.onay; yiginCiz(); })),
    o.onay ? el('div',{class:'btn-sira',style:'margin-top:14px'},
      el('button',{class:'btn ana',type:'button',onclick:async()=>{ const f=await fotoSec(true); if(f){ o.gelinFoto=f; yiginCiz(); } }}, ikon('kamera'), o.gelinFoto?'Yeniden çek':'Fotoğrafını çek'),
      el('button',{class:'btn',type:'button',onclick:async()=>{ const f=await fotoSec(false); if(f){ o.gelinFoto=f; yiginCiz(); } }}, ikon('galeri'), 'Galeriden')) : null,
    o.gelinFoto ? el('div',{class:'secilen-fotolar'}, el('figure',{}, el('img',{src:'data:image/jpeg;base64,'+o.gelinFoto.kucuk,alt:'Gelinin fotoğrafı'}))) : null,
    el('p',{class:'muted',style:'margin-top:12px',text:'İpucu: ayakta, boydan, düz ışıkta çekilmiş fotoğraf en iyi sonucu verir.'})
  ], alt: el('div',{class:'alt-sabit'}, el('div',{class:'wrap btn-sira'},
    el('button',{class:'btn',type:'button',onclick:()=>git('elbise')}, ikon('geri'), 'Önceki'),
    el('button',{class:'btn ana',type:'button',onclick:()=>{ if(!o.onay) return bildir('Gelin kabul etmeden devam edilemez.'); if(!o.gelinFoto) return bildir('Önce gelinin fotoğrafını çek.');
      if (o.gelinId) erisimYaz(o.gelinId,'gorselOnay'); git('sahne'); }}, 'Devam')))};
}
function studyoSahne(o, git){
  const sahneSec = o.mod==='post' ? ['vitrin','cekim','bahce'] : ['cekim','salon','bahce','vitrin'];
  return { icerik:[
    el('h2',{class:'soru',text: o.mod==='post' ? 'Nasıl bir fotoğraf?' : 'Nerede olsun?'}),
    el('p',{class:'soru-alt',text: o.mod==='post' ? 'Bir yer seç. Post ve hikâye ölçüsünde iki görsel hazırlanır.' : 'Birkaç yer seç. Her biri için bir fotoğraf hazırlanır (en fazla 3).'}),
    el('div',{class:'kart ic'}, ...sahneSec.map(k=>tikSatiri(SAHNE_AD[k], null, o.sahneler.includes(k), ()=>{
      if (o.mod==='post') o.sahneler=[k]; else if (o.sahneler.includes(k)) o.sahneler=o.sahneler.filter(x=>x!==k); else if (o.sahneler.length<3) o.sahneler.push(k); else bildir('En fazla 3 yer.');
      yiginCiz(); }))),
    alan('Eklensin mi? (en fazla 3)', ekCipleri(o)),
    alan('Başka isteğin (isteğe bağlı)', (()=>{ const t=el('input',{class:'girdi',placeholder:'Örnek: Saçlar açık olsun',oninput:e=>o.not=e.target.value}); t.value=o.not; return t; })()),
    el('p',{class:'muted',style:'margin-top:14px',text:'Not: Yapay zekâ gelinliğin detaylarını biraz değiştirebilir. Görseller fikir vermek içindir.'})
  ], alt: el('div',{class:'alt-sabit'}, el('div',{class:'wrap btn-sira'},
    el('button',{class:'btn',type:'button',onclick:()=>git(o.mod==='gelin'?'gelin':'elbise')}, ikon('geri'), 'Önceki'),
    el('button',{class:'btn ana',type:'button',onclick:()=>{ if(!o.sahneler.length) return bildir('Bir yer seç.'); studyoUret(o); git('sonuc'); }}, ikon('yildiz'), 'Hazırla')))};
}
function ekCipleri(o, liste){
  liste = liste || o.ekler;
  return el('div',{class:'cipler',style:'margin-top:0'}, ...Object.entries(EK_AD).map(([k,ad])=>el('button',{class:'cip',type:'button','aria-pressed':String(liste.includes(k)),onclick:()=>{
    const i = liste.indexOf(k); if (i>=0) liste.splice(i,1); else if (liste.length<EK_SINIRI) liste.push(k); else bildir('En fazla 3 tane.'); yiginCiz(); }}, ad)));
}
function studyoIstek(o, ek){
  return Object.assign({ mod:o.mod, elbise:o.elbise, modelId:o.elbise.length?null:o.modelId, gelinFoto:o.gelinFoto, onay:o.onay, gelinId:o.gelinId, ekler:o.ekler, not:o.not }, ek);
}
async function studyoUret(o){
  const isler = o.mod==='post'
    ? [{ad:'Post (4:5)', mod:'post', sahne:o.sahneler[0]}, {ad:'Hikâye (9:16)', mod:'hikaye', sahne:o.sahneler[0]}]
    : o.sahneler.map(s=>({ad:SAHNE_AD[s], mod:o.mod, sahne:s}));
  const yeni = isler.map(x=>({ad:x.ad, durum:'bekliyor', is:x}));
  o.sonuclar.push(...yeni);
  if (o.mod==='post' && !o.yazi) api('postYazisi', S.token, o.modelId||'', o.not).then(t=>{ o.yazi=t; yiginCiz(); }).catch(()=>{});

    catch(e){ r.durum='hata'; r.hata=e.message; if (/faturalı|sınırı/.test(e.message)){ yeni.filter(x=>x.durum==='bekliyor').forEach(x=>{ x.durum='hata'; x.hata=e.message; }); break; } }
  }

function studyoSonuc(o, git){

      el('button',{class:'btn yumusak tam',type:'button',style:'margin-top:12px',onclick:()=>{ if(!o.duzenEk.length) return bildir('Önce ne eklensin seç.');

        api('gorselUret', S.token, {mod:'duzenle', kaynak:{b64:sec.b64, tip:'image/jpeg'}, ekler:o.duzenEk.slice(), gelinId:o.gelinId})
          .then(s=>{ r.b64=s.b64; r.durum='hazir'; }).catch(e=>{ r.durum='hata'; r.hata=e.message; bildir(e.message); }).finally(yiginCiz); }}, ikon('yildiz'), 'Değişikliği uygula'),
      el('div',{class:'btn-sira',style:'margin-top:10px'},
        el('button',{class:'btn',type:'button',onclick:()=>gorselPaylas(sec)}, ikon('paylas'), 'Paylaş'),
        el('button',{class:'btn',type:'button',onclick:()=>gorselKaydet(o, sec)}, ikon('tik'), 'Kaydet'))) : null,
    el('p',{class:'muted',style:'margin-top:14px',text: o.mod==='gelin' ? 'Gelinin fotoğrafı hiçbir yere kaydedilmedi. Bu ekranı kapatınca hepsi silinir.' : 'Fotoğrafı telefona kaydetmek için üstüne basılı tutabilirsin.'})
  ], alt: el('div',{class:'alt-sabit'}, el('div',{class:'wrap btn-sira'},
    el('button',{class:'btn',type:'button',onclick:()=>{ o.secili=null; git('sahne'); }}, 'Yeniden hazırla'),
    el('button',{class:'btn ana',type:'button',onclick:()=>{ o.gelinFoto=null; o.sonuclar=[]; kapat(o); }}, ikon('tik'), 'Bitir ve sil')))};
}
async function gorselPaylas(r){
  try{
    const bayt = Uint8Array.from(atob(r.b64), c=>c.charCodeAt(0));
    const dosya = new File([bayt], 'perihan-moda.jpg', {type:'image/jpeg'});
    if (navigator.canShare && navigator.canShare({files:[dosya]})){ await navigator.share({files:[dosya], title:DUKKAN}); return; }
  }catch(e){ if (e && e.name==='AbortError') return; }
  bildir('Paylaşma açılmadı. Fotoğrafın üstüne basılı tutup kaydet, sonra WhatsApp ya da Instagram\'dan gönder.');

async function gorselKaydet(o, r){
  const kucuk = await b64Kucuk(r.b64);

    return;
  }
  if (!o.modelId) return bildir('Kayıtlı bir model seçmediğin için telefona kaydet: fotoğrafa basılı tut.');
  const v = await islem('fotoYukle',['model', o.modelId, f, false], 'Kaydediliyor…'); if (v) bildir('Modelin fotoğraflarına kaydedildi.');
}

<script>
/* Ekler: bildirimler (zil), kiralık geri dönüş takibi, sesli konuşma, profil fotoğrafı, toplu model fotoğrafı. */

/* ---------------- bildirimler ---------------- */

    const f = gunFark(g.iadeTarihi);

    else { const gr=gunGrubu(g.iadeTarihi); if (gr) ekle(gr,'aski', g.ad+': gelinlik geri gelecek', tarihUzun(g.iadeTarihi)+(g.iadeKisi?' · '+g.iadeKisi:''), g.id); }
  });
  v.provalar.filter(p=>p.durum==='planli' && gelin(p.gelinId)).forEach(p=>{
    const g = gelin(p.gelinId), f = gunFark(p.tarih), ad = p.tur==='prova' ? provaSirasi(p)+'. prova' : RANDEVU_AD[p.tur];
    if (f<0 && f>=-14) ekle('Gecikenler','tik', g.ad+': '+ad+' işaretlenmedi', tarihUzun(p.tarih)+'. Geldiyse "Yapıldı" de.', g.id, true);
    else { const gr=gunGrubu(p.tarih); if (gr) ekle(gr,'takvim', g.ad+': '+ad, randevuYazi(p)+(gr==='Yarın'&&!p.hatirlatildi?' · hatırlatma gönderilmedi':''), g.id); }
  });
  v.gelinler.filter(g=>g.durum!=='iptal' && !g.anonim && g.dugunTarihi).forEach(g=>{
    const gr = gunGrubu(g.dugunTarihi); if (gr) ekle(gr,'gelinlik', g.ad+': düğün', gr==='Bugün'?'Düğünü bugün, mutluluklar dileyin':tarihUzun(g.dugunTarihi), g.id);
  });
  v.gelinler.filter(g=>g.durum==='aktif' && g.teslimTarihi).forEach(g=>{
    const f = gunFark(g.teslimTarihi);
    if (f<0) ekle('Gecikenler','gelinlik', g.ad+': teslim günü geçti', tarihUzun(g.teslimTarihi)+'. Teslim edildiyse işaretle.', g.id, true);
    else { const gr=gunGrubu(g.teslimTarihi); if (gr) ekle(gr,'gelinlik', g.ad+': teslim', tarihUzun(g.teslimTarihi), g.id); }
  });
  (v.sifreTalepleri||[]).forEach(t=>ekle('Bugün','kilit', t.ad+' şifresini unuttu', 'Ayarlar\'dan yeni şifre ver', null));
  return ls;
}
const BILDIRIM_GRUPLARI = ['Gecikenler','Bugün','Yarın','Bu hafta'];
function bildirimSayisi(){ return bildirimListesi().filter(x=>x.grup==='Gecikenler'||x.grup==='Bugün').length; }
function zilCiz(){

}
SAYFA.bildirimler = function(o){

    ...BILDIRIM_GRUPLARI.filter(gr=>ls.some(x=>x.grup===gr)).map(gr=>bolum(gr, ls.filter(x=>x.grup===gr).length, el('div',{class:'kart'}, el('ul',{class:'liste'},
      ...ls.filter(x=>x.grup===gr).map(x=>el('li',{}, el('button',{class:'satir bildirim-satir'+(x.kirmizi?' kirmizi':''),type:'button',
        onclick:()=>x.gid ? ac({tip:'gelin',id:x.gid}) : ac({tip:'ayarlar'})},
        el('span',{class:'ikon-daire'}, ikon(x.ikon)), el('span',{class:'orta'}, el('b',{text:x.baslik}), el('span',{text:x.alt}))))))))),
    el('p',{class:'muted',style:'margin-top:18px;text-align:center',text:'Uygulama kapalıyken bildirim için Ayarlar\'dan Google Takvim hatırlatmasını aç.'})));
};

/* ---------------- kiralık geri dönüş ---------------- */

  return el('div',{class:'geri-donus'+(gecikti?' gecikti':'')},

    el('div',{class:'btn-sira uc',style:'margin-top:12px'},

      el('button',{class:'btn wa',type:'button',onclick:()=>{ const m = (g.iadeKisi?'Merhaba '+ilkAd(g.iadeKisi)+', ':'Merhaba '+ilkAd(g.ad)+' Hanım, ')+DUKKAN+"'dan yazıyoruz. Kiralık gelinliğin dönüş günü "+(g.iadeTarihi?tarihUzun(g.iadeTarihi):'yaklaştı')+'. Uygun olduğunuz saati yazar mısınız? Mutluluklar dileriz.';
        erisimYaz(g.id,'whatsapp'); waAc(tel, m); }}, ikon('wa'), 'Hatırlat'),
      el('button',{class:'btn',type:'button',onclick:()=>iadePanel(g)}, ikon('kalem'), 'Düzenle')),
    el('button',{class:'btn ana tam',type:'button',style:'margin-top:10px',onclick:async()=>{ if(await onay('Gelinlik geri geldi mi?','Geldiyse kontrol et: duvak, kabarık, kılıf tamam mı?','Geri geldi')) islem('gelinDurum',[g.id,'iade']); }}, ikon('tik'), 'Geri geldi'));
}
function iadePanel(g, teslimSonrasi){
  const f = { iadeTarihi:g.iadeTarihi||gunEkle(bugun(),2), iadeYeri:g.iadeYeri||'Dükkana getirecek', iadeKisi:g.iadeKisi||'', iadeTelefon:telGoster(g.iadeTelefon||''), iadeNot:g.iadeNot||'' };
  const kutu = (k, ph, ek)=>{ const e=el('input',Object.assign({class:'girdi',placeholder:ph,oninput:ev=>f[k]=ev.target.value},ek||{})); e.value=f[k]; return e; };
  ac({tip:'panel', duzenleme:true, kur:(k)=>[el('h3',{text: teslimSonrasi ? 'Teslim edildi. Ne zaman geri gelecek?' : 'Geri dönüş bilgileri'}),
    el('p',{class:'aciklama',text:g.ad+' · kiralık gelinlik'}),
    alan('Geri geleceği gün', tarihSecici(()=>f.iadeTarihi, t=>f.iadeTarihi=t, false)),
    alan('Nereye?', el('div',{}, secenek([['Dükkana getirecek','Dükkana'],['Biz alacağız','Biz alacağız']], ()=>f.iadeYeri, x=>{ f.iadeYeri=x; }, 'dort'))),
    alan('Kim getirecek? (isteğe bağlı)', kutu('iadeKisi','Örnek: Annesi Ayşe Hanım')),
    alan('Onun telefonu (isteğe bağlı)', kutu('iadeTelefon','0532 123 45 67',{type:'tel',inputmode:'tel'})),
    alan('Not (isteğe bağlı)', kutu('iadeNot','Örnek: Adres Bahçelievler, akşam 6\'dan sonra')),
    el('button',{class:'btn ana tam',type:'button',style:'margin-top:16px',onclick:async()=>{ const v=await islem('iadeBilgisiKaydet',[g.id, f]); if(v){ k(); bildir('Kaydedildi. Bildirimlerde hatırlatılacak.'); } }}, ikon('tik'), 'Kaydet')]});
}

/* ---------------- profil fotoğrafı ---------------- */
function kisiAvatar(k, buyuk){
  const a = el('span',{class:'av'+(buyuk?' b':''),style:'background:'+AV_RENK[(k.renk||0)%AV_RENK.length],'aria-hidden':'true'});

}

  if (v) bildir('Profil fotoğrafı kondu.');

/* ---------------- toplu fotoğraf ---------------- */
function fotolarSec(enCok){
  return new Promise(res=>{
    const inp = el('input',{type:'file',accept:'image/*',multiple:true,style:'display:none'});
    inp.addEventListener('change', async ()=>{
      const ls = [...(inp.files||[])].slice(0, enCok||20); inp.remove();
      if (!ls.length) return res([]);
      const cikti = [];
      for (let i=0;i<ls.length;i++){ bekle('Fotoğraflar hazırlanıyor… '+(i+1)+'/'+ls.length); try{ cikti.push(await fotoHazirla(ls[i])); }catch(e){} }
      bekleBitti(); res(cikti);
    });
    document.body.append(inp); inp.click();
  });
}
async function topluYukle(sahip, sahipId, fotolar){
  let tamam = 0;
  for (let i=0;i<fotolar.length;i++){
    bekle('Yükleniyor… '+(i+1)+'/'+fotolar.length);
    try{ veriAl(await api('fotoYukle', S.token, sahip, sahipId, fotolar[i])); tamam++; }catch(e){ bildir(e.message); break; }
  }
  bekleBitti(); return tamam;

        bekleBitti(); bildir(n+' model eklendi. Adlarını sonra düzeltebilirsin.'); }},
        el('b',{text:'Her fotoğraf ayrı bir model'}), el('span',{text:'Vitrindeki farklı gelinlikler'})),
      el('button',{type:'button',onclick:()=>{ k(); setTimeout(()=>ac({tip:'panel', duzenleme:true, kur:(k2)=>{ const ad=el('input',{class:'girdi',placeholder:'Örnek: Balık dantel'});

          if (!ad.value.trim()) return bildir('Adını yaz.');
          const v = await islem('modelKaydet',[{ad:ad.value}]); if (!v) return; k2();
          const n = await topluYukle('model', v.sonId, fs); bildir(ad.value+': '+n+' fotoğraf eklendi.'); }}, ikon('tik'), 'Kaydet')]; }}),450); }},
        el('b',{text:'Hepsi aynı modelin'}), el('span',{text:'Bir gelinliğin önden, arkadan, yakından fotoğrafları'})))]});
}

/* ---------------- sesli konuşma ---------------- */
function hitap(ad){ if (/abla/i.test(ad||'')) return ad; if ((ad||'')==='Çağatay') return ad; return ilkAd(ad)+' Hanım'; }
let SES_BAGLAM = null;
function sesBaglami(){ if (!SES_BAGLAM){ const C = window.AudioContext || window.webkitAudioContext; if (C) SES_BAGLAM = new C(); } if (SES_BAGLAM && SES_BAGLAM.state==='suspended') SES_BAGLAM.resume(); return SES_BAGLAM; }
function pcmCal(b64, oran){
  return new Promise(res=>{
    const ctx = sesBaglami(); if (!ctx) return res(false);
    const bayt = Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
    const veri = new Int16Array(bayt.buffer, 0, Math.floor(bayt.length/2));
    const buf = ctx.createBuffer(1, veri.length, oran);
    const kanal = buf.getChannelData(0);
    for (let i=0;i<veri.length;i++) kanal[i] = veri[i]/32768;
    const kaynak = ctx.createBufferSource(); kaynak.buffer = buf; kaynak.connect(ctx.destination);
    kaynak.onended = ()=>res(true); kaynak.start(); SES_BAGLAM.__kaynak = kaynak;
  });
}
function telefonSesiyle(metin){
  return new Promise(res=>{
    if (!window.speechSynthesis) return res(false);
    const u = new SpeechSynthesisUtterance(metin); u.lang='tr-TR'; u.rate=0.95;
    const tr = speechSynthesis.getVoices().find(x=>/tr/i.test(x.lang)); if (tr) u.voice = tr;
    u.onend = ()=>res(true); u.onerror = ()=>res(false); speechSynthesis.speak(u);
  });
}
async function sesliOku(metin, o){
  o.durum='konusuyor'; o.son=metin; yiginCiz();
  try{ const s = await api('seslendir', S.token, metin); if (o.kapandi) return; await pcmCal(s.b64, s.oran); }
  catch(e){ if (!o.kapandi) await telefonSesiyle(metin); }
}
function sesliDinleBir(){
  return new Promise(res=>{
    const Tanima = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Tanima) return res({hata:'yok'});
    const d = new Tanima(); d.lang='tr-TR'; d.interimResults=false; d.continuous=false;
    let metin=''; d.onresult = e=>{ metin = [...e.results].map(r=>r[0].transcript).join(' '); };
    d.onerror = e=>res({hata:e.error}); d.onend = ()=>res({metin});
    try{ d.start(); SES_BAGLAM && (SES_BAGLAM.__dinleyici = d); }catch(e){ res({hata:'baslamadi'}); }
  });
}
async function konusmaDongusu(o){
  await sesliOku('Buyurun '+hitap(S.me.ad)+', size nasıl yardımcı olabilirim?', o);
  let bosSayisi = 0;
  while (!o.kapandi){
    o.durum='dinliyor'; yiginCiz();
    const r = await sesliDinleBir();
    if (o.kapandi) return;
    if (r.hata){ o.durum='hata'; o.son = r.hata==='yok' ? 'Bu telefon sesli dinlemeyi desteklemiyor. Aşağıya yazabilir ya da klavyedeki mikrofona basabilirsin.' : 'Mikrofonu açamadım. Aşağıya yazabilir ya da klavyedeki mikrofona basabilirsin.'; yiginCiz(); return; }
    if (!r.metin || !r.metin.trim()){ if (++bosSayisi>=2){ await sesliOku('Başka bir şey olursa yine buradayım.', o); o.durum='bitti'; yiginCiz(); return; } continue; }
    bosSayisi = 0;
    await konusmaSor(o, r.metin);
  }
}
async function konusmaSor(o, soru){
  o.sen = soru; o.durum='dusunuyor'; yiginCiz();
  S.sohbet.push({kim:'ben', metin:soru});
  let cevap;
  try{ const r = await api('sor', S.token, soru, S.sohbet.slice(-7,-1), true); cevap = r.cevap; S.sohbet.push({kim:'ai', metin:r.cevap, gelinIdler:r.gelinIdler}); o.gelinIdler = r.gelinIdler; }
  catch(e){ cevap = e.message; }
  if (!o.kapandi) await sesliOku(cevap, o);
}
SAYFA.konusma = function(o){
  if (!o.basladi){ o.basladi = true; o.durum='baslıyor'; o.kapaninca = ()=>{ o.kapandi=true; try{ SES_BAGLAM && SES_BAGLAM.__kaynak && SES_BAGLAM.__kaynak.stop(); SES_BAGLAM && SES_BAGLAM.__dinleyici && SES_BAGLAM.__dinleyici.abort(); speechSynthesis && speechSynthesis.cancel(); }catch(e){} };
    setTimeout(()=>konusmaDongusu(o), 50); }
  const yazi = { 'baslıyor':'Hazırlanıyor…', konusuyor:'Konuşuyor…', dinliyor:'Seni dinliyorum, konuş', dusunuyor:'Düşünüyor…', hata:'Sesle olmadı', bitti:'Görüşmek üzere' }[o.durum] || '';
  const yazKutu = el('input',{class:'girdi',placeholder:'Ya da buraya yaz','aria-label':'Soru'});
  return el('div',{class:'sayfa'}, sayfaBas(o,'Konuşarak sor'), el('div',{class:'konusma'},
    el('div',{class:'ses-daire '+(o.durum||''),'aria-hidden':'true'}, ikon(o.durum==='konusuyor'?'hoparlor':'mik')),
    el('div',{class:'durum-yazi',role:'status',text:yazi}),
    o.sen ? el('div',{class:'sen',text:'Sen: '+o.sen}) : null,
    el('div',{class:'son-yazi',text:o.son||''}),
    ...(o.gelinIdler||[]).filter(gelin).map(id=>el('button',{class:'btn yumusak',type:'button',style:'margin-top:10px',onclick:()=>ac({tip:'gelin',id})}, ilkAd(gelin(id).ad)+' kartını aç')),
    (o.durum==='hata'||o.durum==='bitti') ? el('div',{style:'width:100%;max-width:520px;margin-top:18px;display:grid;gap:10px'},
      el('div',{style:'display:flex;gap:8px'}, yazKutu, el('button',{class:'btn ana',type:'button',onclick:()=>{ if(yazKutu.value.trim()) konusmaSor(o, yazKutu.value.trim()); }}, 'Sor')),
      el('button',{class:'btn tam',type:'button',onclick:()=>{ sesBaglami(); konusmaDongusu(o); }}, ikon('mik'), 'Tekrar sesle dene')) : null),
    el('div',{class:'alt-sabit'}, el('div',{class:'wrap'}, el('button',{class:'btn tehlike tam',type:'button',onclick:()=>kapat(o)}, 'Bitir'))));
};
</script>
